name: checks

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.event_name }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-checks:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: npm ci --ignore-scripts
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: npm test
      - run: npm run check:web

  checks:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check runtime dependency files are tracked
        run: |
          git ls-files --error-unmatch python/core-requirements.txt python/evidence-requirements.txt python/asr-requirements.txt
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --locked --extra evidence
      - name: Install Chromium headless shell and dependencies on Linux
        if: runner.os == 'Linux'
        run: uv run --no-sync playwright install --with-deps --only-shell chromium
      - name: Install Chromium headless shell on Windows
        if: runner.os == 'Windows'
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          uv run --no-sync playwright install --only-shell chromium
          if ($LASTEXITCODE -ne 0) {
            uv run --no-sync playwright install --with-deps --only-shell chromium
          }
          exit $LASTEXITCODE
      - run: npm ci --ignore-scripts
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - name: Run isolated tests in parallel without a live Codex chat
        run: uv run --no-sync scripts/test.py --jobs 3 --verbose
        timeout-minutes: 10
        env:
          BROADER_VIDS_TEST_BROWSER: chromium
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          CODEX_THREAD_ID: ""
          CODEX_SESSION_ID: ""
      - run: npm test
      - run: npm run check:web
      - run: uv build --wheel --out-dir python
      - run: npm pack --ignore-scripts
      - run: uv run --no-sync scripts/verify_package.py
