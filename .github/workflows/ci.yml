name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check runtime dependency files are tracked
        run: |
          git ls-files --error-unmatch \
            python/core-requirements.txt \
            python/evidence-requirements.txt \
            python/asr-requirements.txt
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --locked --extra evidence
      - name: Install Chromium and Linux dependencies for dashboard tests
        run: uv run --no-sync playwright install --with-deps chromium
      - run: npm ci --ignore-scripts
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - name: Run isolated tests in parallel without a live Codex chat
        run: uv run --no-sync scripts/test.py --jobs 2
        env:
          CODEX_THREAD_ID: ""
          CODEX_SESSION_ID: ""
      - run: npm test
      - run: npm run check:web
      - run: uv build --wheel --out-dir python
      - run: npm pack --ignore-scripts
      - run: uv run --no-sync scripts/verify_package.py
