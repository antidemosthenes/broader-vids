name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --locked --extra evidence
      - run: npm ci --ignore-scripts
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync python -m unittest discover -s tests
      - run: npm test
      - run: npm run check:web
      - run: uv build --wheel --out-dir python
      - run: npm pack --ignore-scripts
      - run: uv run --no-sync scripts/verify_package.py
